name: Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after all checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pytest:
    name: Python API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Server/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/pytest -v --json-report --json-report-file=tests/pytest/pytest-report.json

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: Server/tests/pytest/pytest-report.json

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:5001' }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Client/dist

  newman:
    name: Newman API tests
    runs-on: ubuntu-latest
    needs: pytest
    defaults:
      run:
        working-directory: Server/tests/postman_newman
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r ../../requirements.txt

      - name: Start Flask API
        run: |
          python ../../app.py > "$RUNNER_TEMP/flask.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/flask.pid"
          curl --retry 20 --retry-delay 1 --fail http://127.0.0.1:5001/health

      - name: Install Newman
        run: npm ci

      - name: Run Newman collection
        run: |
          npx newman run book_api_postman_collection.json \
            -e postman_environment.json \
            -r cli,json \
            --reporter-json-export newman-result.json \
            --delay-request 100 \
            --timeout-request 5000

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: Server/tests/postman_newman/newman-result.json

  playwright:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: Client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r ../Server/requirements.txt

      - name: Start Flask API
        run: |
          python ../Server/app.py > "$RUNNER_TEMP/flask-playwright.log" 2>&1 &
          curl --retry 20 --retry-delay 1 --fail http://127.0.0.1:5001/health

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Client/playwright-report

  deploy:
    name: Deploy through hosting webhook
    runs-on: ubuntu-latest
    needs: [pytest, frontend, newman, playwright]
    if: >-
      success() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Client/dist

      - name: Trigger deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail-with-body --request POST "$DEPLOY_HOOK_URL" \
            --header "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"repository":"'"${GITHUB_REPOSITORY}"'","sha":"'"${GITHUB_SHA}"'"}'